# Reusable workflow: builds the calling project, runs the shared third-party
# check on the output, then runs the project's own check command if it has one
# (a "check" script in package.json: axe, sideways scrolling, screenshots). Projects call it from their own .github/workflows/principles.yml.
name: Principles checks

on:
  workflow_call:
    inputs:
      output-dir:
        description: The folder the build writes the site to, e.g. dist or dist/client
        required: true
        type: string
      build-command:
        description: How to build the project (empty to skip, for sites with no build)
        required: false
        type: string
        default: npm run build
      install-command:
        description: How to install dependencies (empty to skip)
        required: false
        type: string
        default: npm ci
      node-version:
        required: false
        type: string
        default: '22'
      allow:
        description: Extra hosts, comma-separated. Prefer listing them in .agents/allowed-hosts.txt with a note.
        required: false
        type: string
        default: ''

jobs:
  third-party:
    name: Third-party check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - uses: actions/checkout@v5
        with:
          repository: kyle-pace/principles
          path: .principles-src

      - name: Check outside hosts
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
          ALLOW: ${{ inputs.allow }}
        run: |
          # Hosts Kyle approved for this project, one per line with a note.
          approved=()
          [ -f .agents/allowed-hosts.txt ] && approved=(--allow-file .agents/allowed-hosts.txt)
          node .principles-src/checks/third-party.mjs "$OUTPUT_DIR" --allow "$ALLOW" "${approved[@]}"

      # The project's own check command, from "Before you call it done" in the
      # principles. Projects without a "check" script skip these steps.
      - name: Look for a check command
        id: project-check
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No check script in package.json; skipping."
          fi

      - name: Install a browser for the check
        if: steps.project-check.outputs.found == 'true' && hashFiles('node_modules/playwright/package.json') != ''
        run: npx playwright install --with-deps chromium

      - name: Run the project's check
        if: steps.project-check.outputs.found == 'true'
        run: npm run check

      - name: Keep the screenshots
        if: always() && steps.project-check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: check-screenshots
          path: .check/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
