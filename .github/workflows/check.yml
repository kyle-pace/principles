# Reusable workflow: builds the calling project and runs the shared checks on
# the output. Projects call it from their own .github/workflows/principles.yml.
name: Principles checks

on:
  workflow_call:
    inputs:
      output-dir:
        description: The folder the build writes the site to, e.g. dist or dist/client
        required: true
        type: string
      build-command:
        description: How to build the project (empty to skip, for sites with no build)
        required: false
        type: string
        default: npm run build
      install-command:
        description: How to install dependencies (empty to skip)
        required: false
        type: string
        default: npm ci
      node-version:
        required: false
        type: string
        default: '22'
      allow:
        description: Extra hosts, comma-separated. Prefer listing them in .agents/allowed-hosts.txt with a note.
        required: false
        type: string
        default: ''

jobs:
  third-party:
    name: Third-party check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - uses: actions/checkout@v5
        with:
          repository: kyle-pace/principles
          path: .principles-src

      - name: Check outside hosts
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
          ALLOW: ${{ inputs.allow }}
        run: |
          # Hosts Kyle approved for this project, one per line with a note.
          approved=()
          [ -f .agents/allowed-hosts.txt ] && approved=(--allow-file .agents/allowed-hosts.txt)
          node .principles-src/checks/third-party.mjs "$OUTPUT_DIR" --allow "$ALLOW" "${approved[@]}"
