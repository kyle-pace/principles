# Reusable workflow: builds the calling project, then runs
#   1. the third-party check on the built site (outside hosts)
#   2. the stack check (Amplitude in, Firebase Analytics out, Firebase config matches)
#   3. the project's own check command if it has one (a "check" script in
#      package.json: axe, sideways scrolling, JavaScript weight, screenshots)
# An app with no website leaves output-dir, install-command and build-command
# empty and gets the stack check alone. Projects call it from their own .github/workflows/principles.yml.
name: Principles checks

on:
  workflow_call:
    inputs:
      output-dir:
        description: The folder the build writes the site to, e.g. dist or dist/client. Leave empty for a project with no website.
        required: false
        type: string
        default: ''
      check-script:
        description: The package.json script that runs the page check, if it isn't called "check"
        required: false
        type: string
        default: check
      build-command:
        description: How to build the project (empty to skip, for sites with no build)
        required: false
        type: string
        default: npm run build
      install-command:
        description: How to install dependencies (empty to skip)
        required: false
        type: string
        default: npm ci
      node-version:
        required: false
        type: string
        default: '22'
      allow:
        description: Extra hosts, comma-separated. Prefer listing them in .agents/allowed-hosts.txt with a note.
        required: false
        type: string
        default: ''

jobs:
  third-party:
    name: Third-party check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - uses: actions/checkout@v5
        with:
          repository: kyle-pace/principles
          path: .principles-src

      - name: Check outside hosts
        if: inputs.output-dir != ''
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
          ALLOW: ${{ inputs.allow }}
        run: |
          # Hosts Kyle approved for this project, one per line with a note.
          approved=()
          [ -f .agents/allowed-hosts.txt ] && approved=(--allow-file .agents/allowed-hosts.txt)
          node .principles-src/checks/third-party.mjs "$OUTPUT_DIR" --allow "$ALLOW" "${approved[@]}"

      # The project's own check command, from "Before you call it done" in the
      # principles. Projects without a "check" script skip these steps.
      - name: Look for a check command
        id: project-check
        if: inputs.output-dir != ''
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          if [ -f package.json ] && SCRIPT="$CHECK_SCRIPT" node -e "process.exit(require('./package.json').scripts?.[process.env.SCRIPT] ? 0 : 1)"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $CHECK_SCRIPT script in package.json; skipping."
          fi

      - name: Install a browser for the check
        if: steps.project-check.outputs.found == 'true' && hashFiles('node_modules/playwright/package.json') != ''
        run: npx playwright install --with-deps chromium

      - name: Run the project's check
        if: steps.project-check.outputs.found == 'true'
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: npm run "$CHECK_SCRIPT"

      - name: Check the stack (Amplitude and Firebase)
        if: always()
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          [ -d .principles-src ] || { echo "The principles weren't checked out; an earlier step failed."; exit 1; }
          built=()
          [ -n "$OUTPUT_DIR" ] && built=(--output-dir "$OUTPUT_DIR")
          node .principles-src/checks/stack.mjs . "${built[@]}"

      - name: Keep the screenshots
        if: always() && steps.project-check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: check-screenshots
          path: .check/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
